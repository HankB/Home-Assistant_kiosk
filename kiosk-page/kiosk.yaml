kiosk_mode:
  hide_header: true
views:
  - type: panel
    path: kiosk
    title: Kiosk
    cards:
      - type: vertical-stack
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: weather-forecast
                entity: weather.forecast_home
                name: Home
                show_forecast: false
              - type: custom:button-card
                entity: sensor.comed_5_minute_price
                name: ComEd Price
                show_state: true
                show_label: true
                state_display: |
                  [[[
                    const price = parseFloat(entity.state);
                    if (isNaN(price)) return "Unavailable";
                    return `${price.toFixed(1)} ¢/kWh`;
                  ]]]
                label: |
                  [[[
                    const price = parseFloat(entity.state);
                    if (isNaN(price)) return "";
                    if (price < 8) return "GOOD";
                    if (price < 14) return "MODERATE";
                    return "HIGH";
                  ]]]
                styles:
                  card:
                    - height: 120px
                    - background-color: |
                        [[[
                          const price = parseFloat(entity.state);
                          if (isNaN(price)) return '#2f3542';
                          if (price < 8) return '#2ed573';
                          if (price < 14) return '#8B5A2B';
                          return '#ff4757';
                        ]]]
                  name:
                    - font-weight: bold
                    - color: white
                    - font-size: 16px
                  state:
                    - font-size: 28px
                    - font-weight: bold
                    - color: white
                  label:
                    - font-size: 14px
                    - font-weight: bold
                    - color: white
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.basement_temp_sht31
                name: Basement
                show_state: false
                show_label: true
                icon: mdi:home-thermometer-outline
                label: |
                  [[[
                    const temp = states['sensor.basement_temp_sht31'].state;
                    const humid = states['sensor.basement_humid_sht31'].state;
                    return `${temp}°F   💧 ${humid}%`;
                  ]]]
                styles:
                  card:
                    - height: 95px
                  name:
                    - font-size: 16px
                    - font-weight: bold
                  label:
                    - font-size: 20px
                    - font-weight: bold
              - type: custom:button-card
                entity: sensor.dining_rm_west_temp
                name: Dining Room
                show_state: false
                show_label: true
                icon: mdi:home-thermometer-outline
                label: |
                  [[[
                    const temp = states['sensor.dining_rm_west_temp'].state;
                    const humid = states['sensor.dining_rm_west_humid'].state;
                    return `${temp}°F   💧 ${humid}%`;
                  ]]]
                styles:
                  card:
                    - height: 95px
                  name:
                    - font-size: 16px
                    - font-weight: bold
                  label:
                    - font-size: 20px
                    - font-weight: bold
              - type: custom:button-card
                entity: sensor.aht20_bedroom_temp
                name: Bedroom
                show_state: false
                show_label: true
                icon: mdi:home-thermometer-outline
                label: |
                  [[[
                    const temp = states['sensor.aht20_bedroom_temp'].state;
                    const humid = states['sensor.aht20_bedroom_humid'].state;
                    return `${temp}°F   💧 ${humid}%`;
                  ]]]
                styles:
                  card:
                    - height: 95px
                  name:
                    - font-size: 16px
                    - font-weight: bold
                  label:
                    - font-size: 20px
                    - font-weight: bold
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: light.famrm_cindy
                name: Cindy
                icon: mdi:lightbulb

                tap_action:
                  action: toggle
                hold_action:
                  action: more-info

                show_icon: true
                show_name: true
                show_state: false
                show_label: true

                label: |
                  [[[
                    const light = states['light.famrm_cindy'];

                    if (light.state === 'off') {
                      return 'Off';
                    }

                    const brightness = light.attributes.brightness;

                    if (brightness !== undefined && brightness !== null) {
                      return `${Math.round(brightness / 255 * 100)}%`;
                    }

                    return 'On';
                  ]]]

                styles:
                  card:
                    - height: 56px
                    - padding: 8px 12px
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 40px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 24px
                    - height: 24px
                  img_cell:
                    - width: 40px
                    - height: 40px
                    - border-radius: 50%
                    - justify-self: start
                    - align-self: center
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 18px
                    - font-weight: 500
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 16px

                state:
                  - value: "on"
                    styles:
                      icon:
                        - color: var(--state-light-active-color)
                      img_cell:
                        - background-color: color-mix(in srgb, var(--state-light-active-color) 20%, transparent)

                  - value: "off"
                    styles:
                      icon:
                        - color: var(--state-icon-color)
                      img_cell:
                        - background-color: var(--ha-card-background)
